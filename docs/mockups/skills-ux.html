<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libro de habilidades · IntentoRPG (mockup Paso 2f)</title>
<!-- Mockup INTERACTIVO del Paso 2f (docs/paso2f-habilidades-ux.md): libro por categorías,
     forja de una habilidad (Mejora + 2 Variantes), tooltip rico al pasar el ratón,
     barra de 6 ranuras con arrastre y estado «variante elegida».
     Ábrelo en Chrome directamente (file:///). Arte real: D:\Proyectos\IntentoRPG-assets\web\.
     Los iconos de VARIANTE aún no existen (tandas de Codex, §5): aquí se ven como el icono
     base virado de color + el glifo de su papel (reserva del juego si un asset no carga).
     Parámetros: ?cls=guerrero|maga|arquera &res=1920|1366 &sel=<id> &tip=base|mejora|A|B
                 &drag=<id> (arrastre congelado) &combat=1 &alt=1 &shot=1 (oculta la barra de control) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b10; --panel:#15111a; --panel2:#1b1621; --gold:#e8c06a; --gold2:#f6dd9c; --ink:#ede6d6; --dim:#a39a88; --dim2:#7c7466;
  --line:#2f2638; --ok:#7fd36b; --bad:#e2604f; --c:#e8c06a;
  --r-uni:#f0c45a; --r-area:#ff8a3d; --r-ctrl:#74cdf2; --r-agu:#7fb0e8; --r-apo:#ecc760; --r-mov:#86d47a;
}
*{box-sizing:border-box}
html,body{margin:0;background:#06050a;color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif}
kbd{display:inline-block;min-width:20px;padding:0 5px;border:1px solid #6b5a3a;border-bottom-width:2px;border-radius:4px;background:#1d1710;color:#f3e2b5;font:700 11px/17px Inter,sans-serif;text-align:center}
.ctl{position:sticky;top:0;z-index:100;display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:10px 20px;background:#110e15ee;border-bottom:1px solid var(--line)}
.ctl h1{margin:0 8px 0 0;font:700 17px Cinzel,serif;color:var(--gold)}
.ctl label{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--dim)}
.ctl select,.ctl button{background:#1c1622;color:var(--ink);border:1px solid #3a2f45;border-radius:6px;padding:5px 9px;font:inherit;font-size:13px;cursor:pointer}
body.shot .ctl{display:none}
#fitbox{position:relative}
#screen{position:relative;overflow:hidden;width:1920px;height:1080px;--s:1;
  background:radial-gradient(ellipse 60% 55% at 50% 52%,rgba(120,104,84,.18),transparent 70%),
    repeating-linear-gradient(30deg,rgba(255,255,255,.03) 0 1px,transparent 1px 64px),
    repeating-linear-gradient(-30deg,rgba(255,255,255,.03) 0 1px,transparent 1px 64px),
    radial-gradient(ellipse at 50% 50%,#262019 0%,#121014 60%,#08070a 100%)}
#screen.r768{width:1366px;height:768px;--s:.8}
#screen::after{content:'';position:absolute;inset:0;background:rgba(5,4,8,.55);z-index:1}

/* ======================= PANEL ======================= */
.panel{position:absolute;left:50%;top:50%;z-index:5;width:1560px;height:930px;transform:translate(-50%,-50%) scale(var(--s));transform-origin:50% 50%;
  display:grid;grid-template-rows:86px 1fr 104px;gap:14px;padding:22px 28px 22px;
  background:linear-gradient(#17121c,#120e16);border:1px solid #3a2f45;border-radius:14px;
  box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 0 0 1px rgba(232,192,106,.08)}
.p-head{display:flex;align-items:center;gap:18px}
.p-head .emb{width:64px;height:64px;border-radius:12px;border:1px solid #7a6131;background:#0d0b10 center/cover;box-shadow:0 0 0 3px #1a1420,0 0 18px rgba(232,192,106,.18)}
.p-head h2{margin:0;font:700 30px Cinzel,serif;color:var(--gold);letter-spacing:.6px;font-variant:small-caps}
.p-head .sub{color:var(--dim);font-size:14px;margin-top:2px}
.p-head .sub b{color:var(--ink);font-weight:600}
.p-head .sp{flex:1}
.hbtn{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border:1px solid #4a3c2a;border-radius:8px;background:linear-gradient(#211a14,#16110d);color:var(--ink);font:600 14px Inter;cursor:pointer}
.hbtn img{width:26px;height:26px}
.hbtn.x{width:44px;justify-content:center;padding:0;font-size:20px}
.hbtn:hover{border-color:var(--gold);color:var(--gold2)}
.p-body{display:grid;grid-template-columns:660px 1fr;gap:16px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;position:relative;min-height:0;overflow:hidden}
.card-h{display:flex;align-items:baseline;gap:10px;padding:14px 20px 4px}
.card-h h3{margin:0;font:700 17px Cinzel,serif;color:var(--ink);font-variant:small-caps;letter-spacing:.5px}
.card-h .r{margin-left:auto;color:var(--dim);font-size:13px}

/* ---- libro ---- */
.book{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:min-content;gap:0 14px;padding:0 16px 10px;align-content:start;overflow:auto;max-height:calc(100% - 44px)}
.sec{padding:4px 2px 0}
.sec.full{grid-column:1/-1}
.sec-h{display:flex;align-items:center;gap:7px;height:26px;color:var(--dim);font:600 12px Inter;letter-spacing:1.4px;text-transform:uppercase}
.sec-h img{width:22px;height:22px;opacity:.9}
.sec-h .n{margin-left:auto;font-weight:500;letter-spacing:0;color:var(--dim2)}
.tiles{display:flex;flex-wrap:wrap;gap:6px;padding-top:4px}
.tile{position:relative;width:88px;padding:6px 2px 4px;border-radius:10px;text-align:center;cursor:pointer;outline:none;border:1px solid transparent}
.tile:hover,.tile:focus-visible{background:#1f1926;border-color:#3d3248}
.tile.sel{background:#241c18;border-color:var(--gold);box-shadow:0 0 0 1px rgba(232,192,106,.3),0 0 16px rgba(232,192,106,.15)}
.ico{position:relative;width:66px;height:66px;margin:0 auto;border-radius:9px;background:#0d0b10 center/cover no-repeat;
  box-shadow:inset 0 0 0 2px #3b3044,0 2px 6px rgba(0,0,0,.5)}
.ico.cat-basic{box-shadow:inset 0 0 0 2px #6b5a3a,0 2px 6px #0008}
.tile.locked .ico{filter:grayscale(1) brightness(.45)}
.tile .nm{margin-top:6px;font:600 12.5px/1.15 Inter;color:var(--ink);height:29px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.locked .nm{color:var(--dim2)}
.keycap{position:absolute;left:-4px;top:-4px;z-index:2;min-width:30px;height:19px;padding:0 5px;border-radius:5px;background:#e8c06a;color:#1a120a;font:800 11px/19px Inter;letter-spacing:.3px;box-shadow:0 1px 0 #7a5c22}
.lockb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#d7cdb9;font:700 12px Inter;text-shadow:0 1px 2px #000}
.lockb svg{width:20px;height:20px;opacity:.85}
.pips{position:absolute;right:-5px;bottom:-5px;display:flex;gap:2px;z-index:2}
.pip{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 10px Cinzel,serif;background:#0d0b10;border:1.5px solid #4a3e54;color:#6d6377}
.pip.m.on{border-color:var(--gold);color:var(--gold);background:#2a2012}
.pip.v.on{border-color:var(--gold);background:radial-gradient(#5a4520,#241a0c);color:#ffe7a8}
.pip.v.todo{border-color:var(--gold);color:var(--gold);animation:pulse 1.4s infinite}
.tile.todo .ico{box-shadow:inset 0 0 0 2px var(--gold),0 0 0 2px rgba(232,192,106,.35);animation:pulse 1.6s infinite}
.newdot{position:absolute;right:6px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);z-index:3}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,192,106,.6)}50%{box-shadow:0 0 0 6px rgba(232,192,106,0)}}
.tile.talent .ico{border-radius:50%}
.ttag{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);padding:0 5px;border-radius:4px;background:#2c2238;border:1px solid #5b4a6c;color:#cdb8ec;font:700 9px/14px Inter;letter-spacing:.8px}

/* ---- forja ---- */
.forge{display:grid;grid-template-rows:auto 1fr auto;min-height:0}
.fh{display:grid;grid-template-columns:104px 1fr auto;gap:18px;align-items:center;padding:20px 24px 8px}
.fh .ico{width:104px;height:104px;border-radius:14px}
.fh h4{margin:0;font:700 30px Cinzel,serif;color:var(--gold2);font-variant:small-caps}
.fh .line{margin-top:2px;color:var(--ink);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:13px;background:#211b28;border:1px solid #3a3045;color:#d8cfbf;font:600 12.5px Inter}
.chip img{width:18px;height:18px}
.chip.gold{border-color:#6b5631;color:var(--gold2)}
.rank{display:flex;flex-direction:column;align-items:flex-end;gap:4px;color:var(--dim);font-size:12px}
.rank .dots{display:flex;gap:4px}
.rank .dots i{width:11px;height:11px;border-radius:50%;border:1.5px solid #6b5631}
.rank .dots i.on{background:var(--gold);border-color:var(--gold)}
.rank b{color:var(--gold2);font:700 18px Cinzel,serif}
.tree{position:relative;margin:0 24px;min-height:0}
.tree svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tree path{fill:none;stroke:#3d3248;stroke-width:3}
.tree path.on{stroke:#8a6f38}
.tree path.sel{stroke:var(--gold);stroke-width:4;filter:drop-shadow(0 0 4px rgba(232,192,106,.7))}
.node{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:default}
.node .lbl{margin-top:8px;font:700 11px Inter;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim)}
.node .nm2{font:700 16px Cinzel,serif;color:var(--ink);white-space:nowrap}
.n-base .ico{width:92px;height:92px;border-radius:50%;box-shadow:inset 0 0 0 3px #6b5631,0 0 0 4px #15111a,0 0 0 5px #3b3044}
.n-mej{cursor:pointer}
.n-mej .dia{width:78px;height:78px;margin:0 auto;transform:rotate(45deg);border-radius:12px;overflow:hidden;box-shadow:0 0 0 3px #4a3e54,0 0 0 6px #15111a}
.n-mej .dia .ico{width:110px;height:110px;margin:-16px;transform:rotate(-45deg);border-radius:0;box-shadow:none}
.n-mej.on .dia{box-shadow:0 0 0 3px var(--gold),0 0 0 6px #15111a,0 0 18px rgba(232,192,106,.35)}
.n-mej.off .dia{filter:grayscale(1) brightness(.5)}
.n-mej .badge{position:absolute;left:50%;top:-6px;transform:translateX(-50%);z-index:2}
.vcard{position:absolute;width:380px;height:176px;transform:translate(-50%,-50%);display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:center;padding:14px 16px;
  border-radius:14px;background:linear-gradient(#1d1723,#171219);border:1.5px solid #3d3248;cursor:pointer;transition:transform .12s,opacity .2s,border-color .2s}
.vcard:hover{border-color:#8a6f38;transform:translate(-50%,-50%) translateY(-2px)}
.vcard .ico{width:112px;height:112px;border-radius:12px}
.vcard .num{position:absolute;left:-14px;top:-14px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(#3a2d17,#1a130a);border:2px solid #8a6f38;color:var(--gold2);font:700 15px Cinzel,serif;z-index:3}
.vcard .vn{font:700 18px/1.1 Cinzel,serif;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard .vs{margin-top:6px;color:#d6ccba;font-size:14px;line-height:1.3}
.role{display:inline-flex;align-items:center;gap:5px;margin-top:8px;height:24px;padding:0 9px 0 6px;border-radius:12px;font:700 11.5px Inter;letter-spacing:.8px;text-transform:uppercase;background:#0f0c12;border:1px solid currentColor}
.role svg{width:15px;height:15px}
.vcard.chosen{border-color:var(--gold);background:linear-gradient(#2a2015,#1a140f);box-shadow:0 0 0 1px rgba(232,192,106,.25),0 0 26px rgba(232,192,106,.18)}
.vcard.chosen .num{background:radial-gradient(#e8c06a,#9b7a33);color:#1a120a;border-color:#ffe7a8}
.vcard.other{opacity:.74;filter:saturate(.6)}
.vcard.other:hover{opacity:.9}
.vcard.locked{cursor:default;opacity:.6}
.vcard.locked .ico{filter:grayscale(1) brightness(.45)}
.vcard.todo{border-color:var(--gold);animation:pulse 1.6s infinite}
.seal{position:absolute;right:12px;top:-12px;height:24px;padding:0 10px;border-radius:12px;background:linear-gradient(#f3d488,#b88b35);color:#1a120a;font:800 11px/24px Inter;letter-spacing:1.2px;box-shadow:0 2px 6px #0009}
.lockpill{position:absolute;right:12px;top:-12px;height:24px;padding:0 10px;border-radius:12px;background:#221c28;border:1px solid #4a3e54;color:#cfc4b0;font:700 11px/22px Inter;letter-spacing:.6px;display:inline-flex;align-items:center;gap:5px}
.lockpill svg{width:12px;height:12px;flex:none}
.varglyph{position:absolute;right:-3px;bottom:-3px;width:34px;height:34px;border-radius:50%;background:#0d0b10;border:2px solid currentColor;display:flex;align-items:center;justify-content:center}
.varglyph svg{width:19px;height:19px}
.vico{position:relative;width:112px;height:112px;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 2px #3b3044}
.vico .bgi{position:absolute;inset:0;background:#0d0b10 center/cover no-repeat;filter:brightness(.62) contrast(1.15)}
.vico.ii .bgi{transform:scaleX(-1) scale(1.25);background-position:30% 40%}
.vico.i .bgi{transform:scale(1.25);background-position:70% 40%}
.vico .tint{position:absolute;inset:0;mix-blend-mode:color;opacity:.85}
.vico .gl{position:absolute;left:50%;top:50%;width:48%;height:48%;transform:translate(-50%,-50%);filter:drop-shadow(0 0 6px currentColor) drop-shadow(0 2px 2px #000)}
.vico .gl svg{width:100%;height:100%}
.vico .art{position:absolute;inset:0;background:center/cover no-repeat}
.vico.sm{width:46px;height:46px;border-radius:8px}
.ffoot{display:flex;align-items:center;gap:22px;padding:10px 24px 16px;border-top:1px solid var(--line);margin-top:4px}
.ffoot .t{font:600 12px Inter;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim)}
.sock{position:relative;width:54px;height:54px;border-radius:50%;background:#0d0b10;border:2px dashed #4a3e54;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--dim2);font-size:24px}
.sock.on{border:2px solid #8a6f38;background:radial-gradient(#2a2232,#120e16)}
.sock.on span{font-size:26px}
.sock:hover{border-color:var(--gold)}
.ffoot .note{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px}
.ffoot .note.lock{color:#e6a17a}

/* ---- barra ---- */
.p-bar{display:flex;align-items:center;gap:22px;padding:0 22px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.p-bar .t{font:700 15px Cinzel,serif;color:var(--dim);font-variant:small-caps;letter-spacing:.5px}
.slots{display:flex;gap:10px;padding:6px 14px;border-radius:12px;background:linear-gradient(#0f0c12,#1a1520);border:1px solid #3a2f45}
.slot{position:relative;width:70px;height:70px;border-radius:10px;background:#0b090e;box-shadow:inset 0 0 0 2px #3b3044}
.slot .ico{width:70px;height:70px;border-radius:10px}
.slot .k{position:absolute;left:3px;top:2px;z-index:2;font:800 10.5px Inter;color:#f3e2b5;text-shadow:0 1px 2px #000,0 0 3px #000}
.slot.empty::after{content:'+';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#4a3e54;font-size:28px}
.slot.flex{box-shadow:inset 0 0 0 2px #6b5631}
.slot .flexb{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);z-index:3;padding:0 6px;border-radius:4px;background:#2a2012;border:1px solid #8a6f38;color:var(--gold2);font:800 9px/15px Inter;letter-spacing:1px}
.slot.ok{outline:3px solid var(--ok);outline-offset:3px;box-shadow:0 0 18px rgba(127,211,107,.55)}
.slot.ok::before{content:'✓';position:absolute;right:-9px;top:-11px;z-index:4;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#0d0b10;font:800 13px/20px Inter;text-align:center}
.slot.no{opacity:.35}
.slot.hov{transform:scale(1.07)}
.slot .vp{position:absolute;right:-5px;bottom:-5px;z-index:2}
.hints{margin-left:auto;display:flex;flex-direction:column;gap:6px;color:var(--dim);font-size:13px;text-align:right}
.hints span{display:flex;align-items:center;justify-content:flex-end;gap:6px}

/* ---- tooltip ---- */
#tip{position:absolute;z-index:50;width:380px;pointer-events:none;opacity:0;transform:scale(var(--s)) translateY(4px);transform-origin:0 0;transition:opacity .12s,transform .12s;
  background:linear-gradient(#1c1621f5,#120e16f5);border:1px solid #6b5631;border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.75),inset 0 0 0 1px rgba(255,255,255,.03);padding:14px 16px 12px}
#tip.on{opacity:1;transform:scale(var(--s))}
#tip .th{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center}
#tip .th .ico{width:46px;height:46px;border-radius:8px}
#tip .tn{font:700 19px/1.1 Cinzel,serif;color:var(--gold2)}
#tip .tk{color:var(--dim);font-size:12px;margin-top:2px}
#tip .tl{margin:10px 0 0;color:var(--ink);font-size:14.5px;line-height:1.35}
#tip .tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
#tip .tg i{font-style:normal;padding:1px 7px;border-radius:9px;background:#272030;color:#cfc3e0;font:600 11px/18px Inter}
#tip .tg i.add{background:#1d3020;color:#a6e69a}
#tip .tg i.del{background:#3a1f1c;color:#f0a093;text-decoration:line-through}
#tip table{width:100%;margin-top:10px;border-collapse:collapse;font-size:13.5px}
#tip td{padding:3px 0;color:#d8cfbf}
#tip td:last-child{text-align:right;font-weight:600;color:var(--ink);white-space:nowrap}
#tip td .nx{color:var(--ok);font-weight:700}
#tip .cmp{margin-top:10px;padding-top:9px;border-top:1px solid #3a3045;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--dim)}
#tip .rc{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #4a3e54;color:#7c7286;flex:none}
#tip .rc svg{width:16px;height:16px}
#tip .rc.me{border-color:currentColor;background:#1a1410}
#tip .rc.ot{border-style:dashed;color:#8a8090}
#tip .bar5{display:flex;gap:3px}
#tip .bar5 b{width:22px;height:7px;border-radius:2px;background:#2d2535}
#tip .bar5 b.on{background:var(--gold)}
#tip .bar5 b.alt{background:#6d6377}
#tip .tf{margin-top:10px;padding-top:8px;border-top:1px solid #3a3045;display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--dim);font-size:12px}
#tip .adv{margin-top:9px;padding:8px 10px;border-radius:7px;background:#0e0b11;border:1px solid #2f2638;color:#bdb3a1;font:12px/1.45 ui-monospace,Consolas,monospace}
#tip .st{margin-top:8px;font:700 12px Inter;letter-spacing:.6px}
#tip .st.ok{color:var(--ok)} #tip .st.lk{color:#e6a17a} #tip .st.g{color:var(--gold)}

#toast{position:absolute;left:50%;top:calc(24px*var(--s));z-index:40;transform:translateX(-50%) scale(var(--s));transform-origin:50% 0;display:flex;align-items:center;gap:12px;padding:10px 18px 10px 10px;
  border-radius:12px;background:linear-gradient(#2a2015,#17120d);border:1px solid #8a6f38;box-shadow:0 10px 30px #000a;color:var(--ink);font-size:14px}
#toast .ico{width:42px;height:42px;border-radius:8px}
#toast b{color:var(--gold2)}
#toast small{display:block;color:var(--dim);font-size:12px}
#ghost{position:absolute;z-index:60;width:70px;height:70px;pointer-events:none;transform:translate(-50%,-50%) scale(calc(var(--s)*1.05));display:none}
#ghost .ico{width:70px;height:70px;border-radius:10px;box-shadow:0 0 0 2px var(--gold),0 10px 24px #000c}
#pop{position:absolute;z-index:45;display:none;padding:12px;border-radius:10px;background:#18131d;border:1px solid #6b5631;box-shadow:0 12px 30px #000b;transform-origin:0 100%}
#pop .g{display:grid;grid-template-columns:repeat(6,48px);gap:8px}
#pop .gm{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;background:radial-gradient(#2a2232,#110d14);border:1.5px solid #5a4a3a;cursor:pointer}
#pop .gm.no{opacity:.25;cursor:not-allowed}
#pop .gm:hover:not(.no){border-color:var(--gold)}
#pop .pt{font:600 12px Inter;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.dragging .tile{cursor:grabbing}
</style>

  sc.style.transform = `scale(${k})`; sc.style.transformOrigin = '0 0'; $('#fitbox').style.height = sc.offsetHeight * k + 'px';
}
function all() { renderHead(); renderBook(); renderForge(); renderBar(); }
function boot() {
  if (Q.get('shot')) document.body.classList.add('shot');
  if (Q.get('cls')) $('#cCls').value = Q.get('cls');
  if (Q.get('res')) $('#cRes').value = Q.get('res');
  if (Q.get('combat')) $('#cCombat').checked = true;
  if (Q.get('alt')) $('#cAlt').checked = true;
  reset($('#cCls').value); fit(); all(); welcomeToast();
  const tip = Q.get('tip');
  if (tip) requestAnimationFrame(() => {
    const el = tip === 'base' ? document.querySelector('.tile.sel') : tip === 'mejora' ? document.querySelector('.n-mej') : document.querySelector(`.vcard[data-w="${tip}"]`);
    const b = el.getBoundingClientRect();
    const ev = { clientX: b.left + b.width * 0.62, clientY: b.top + b.height * 0.55 };
    showTip(ev, tip === 'base' ? () => tipSkill(find(S.sel)) : tip === 'mejora' ? () => tipMejora(find(S.sel)) : () => tipVar(find(S.sel), tip), tip === 'A' || tip === 'B' ? el : null);
    el.dispatchEvent(new Event('noop'));
  });
  const dg = Q.get('drag');
  if (dg) requestAnimationFrame(() => {
    const sk = find(dg); beginDragVisual(sk);
    const tgt = document.querySelector(`.slot[data-slot="${SLOT_OF[sk.cat][1] || SLOT_OF[sk.cat][0]}"]`).getBoundingClientRect();
    moveGhost(tgt.left + tgt.width * 0.7, tgt.top - 4);
  });
}
$('#cCls').onchange = () => { reset($('#cCls').value); all(); welcomeToast(); };
$('#cRes').onchange = () => { fit(); all(); };
$('#cCombat').onchange = () => { S.combat = $('#cCombat').checked; renderForge(); };
$('#cAlt').onchange = () => { S.alt = $('#cAlt').checked; refreshTip(); };
$('#cReset').onclick = () => { reset(S.cls); all(); };
window.addEventListener('resize', fit);
boot();
</script>
