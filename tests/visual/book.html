<!doctype html>

<head>

<title>Libro de habilidades · arnés visual</title>
<!-- Arnés visual del Paso 2 (U2; docs/paso2-implementacion.md §3.12, docs/paso2f-habilidades-ux.md §3).
     Monta el libro REAL (createSkillBook de js/ui-skills.js, css/skills.css) sobre un héroe real
     (tests/helpers/power-harness.mjs). Por defecto con el catálogo 2g de la clase (los borradores de
     tools/convert-v2/out/<clase>/: arte, forja, barra y recomendadas, lo que traerán KA1/KA2);
     &draft=0 usa el catálogo del juego tal cual (y es lo que se usa solo si los borradores ya no están:
     E2 los sustituye por los catálogos reales).
     Sirve la raíz del repo y abre /tests/visual/book.html con:
       ?cls=maga|guerrero|arquera  &lv=<nivel>  &spec=<id>  &sel=<habilidad>  &combat=1
       &forge=spec|none            variantes de la barra de la especialización (por defecto) o ninguna
       &talents=<n>                activas de talento compradas (por defecto 1 desde el Nv 21; 6 = todas)
       &hover=<selector CSS>       tooltip sobre ese elemento · &alt=1 con Alt mantenido
       &pop=<n>                    abre el engarce n · &drag=<habilidad>:<ranura> arrastre a medias
       &swap=<spec>                tira «qué cambia» al cambiar a esa especialización (libro cerrado)
       ?shot=<id>                  una escena con nombre (lista SHOTS abajo)
       ?selftest=1                 ratón y teclado: ←/→, 1–4 bajo el ratón, clic derecho, arrastre, variantes,
                                   Intro, «Recomendado», Alt, engarces, N, combate, T/Esc → <pre id="measure">
       ?measure=1                  A5/A4 de todas las clases × niveles × especializaciones (también sin
                                   especialización pasado el Nv 10 y con las 6 activas de talento) y de cada
                                   forja (window.__uicheck de check()) → <pre id="measure">
       &bare=1 sin barra de controles · &reduce=1 reducir movimiento · &three=local three.js local
     Capturas: node tests/visual/chrome.mjs "<url>" --shot=out.png --size=1366,768 --wait=1500 -->

<style>
  html, body { overflow: hidden; }
  body { margin: 0; background: #0d0b10; color: #ede6d6; font: 13px/1.4 Inter, system-ui, sans-serif; }
  #world { position: fixed; inset: 0; background:
    radial-gradient(ellipse 55% 50% at 50% 45%, rgba(120, 104, 84, 0.22), transparent 70%),
    repeating-linear-gradient(30deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 64px),
    repeating-linear-gradient(-30deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 64px),
    radial-gradient(ellipse at 50% 45%, #2b241c 0%, #15110f 60%, #08070a 100%); }
  #ctl { position: fixed; left: 8px; top: 6px; z-index: 95; display: flex; gap: 8px; align-items: center; padding: 4px 8px; border-radius: 8px;
    background: #110e15ee; border: 1px solid #3a2f45; font-size: 12px; color: #9a917f; }
  #ctl select, #ctl button { background: #1c1622; color: #ede6d6; border: 1px solid #3a2f45; border-radius: 6px; padding: 2px 6px; font: inherit; }
  body.bare #ctl { display: none; }

  #measure:empty { display: none; }
  .fake-cursor { position: fixed; left: 0; top: 0; z-index: 100; width: 18px; height: 26px; pointer-events: none; filter: drop-shadow(0 2px 2px #000); }

<body>
<div id="world"></div>
<div id="ctl">
  <select id="c-cls"><option value="maga">Maga</option><option value="guerrero">Guerrero</option><option value="arquera">Arquera</option></select>
  <select id="c-lv"></select>
  <select id="c-spec"></select>
  <label><input type="checkbox" id="c-combat"> combate</label>
  <label><input type="checkbox" id="c-draft" checked> catálogo 2g</label>
  <button id="c-open" type="button">Libro (T)</button>
</div>
<pre id="measure"></pre>
<script type="module">
import { makeHarness } from '../helpers/power-harness.mjs';
import { CLASSES, SUPPORTS } from '../../js/data.js';
import { normalizeSkillDef } from '../../js/skill-defs.js';
import { isKnown } from '../../js/skill-resolve.js';
import { talentTreesFor } from '../../js/talents.js';
import { createSkillBook } from '../../js/ui-skills.js';
import { specSnapshot, specSwapSummary, recoPlan as HMrecoPlan } from '../../js/hud-model.js';

const Q = new URLSearchParams(location.search);
if (Q.get('bare') === '1') document.body.classList.add('bare');
if (Q.get('reduce') === '1') document.body.classList.add('reduce-motion');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const frame = () => new Promise(r => requestAnimationFrame(() => r()));

// catálogo 2g de cada clase (borradores de KA): habilidades, forja, barra por especialización y
// recomendadas. Import DINÁMICO: si E2 ya los quitó, el arnés sigue con el catálogo del juego
const DRAFT = {};
for (const [id, K] of [['maga', 'MAGA'], ['guerrero', 'GUERRERO'], ['arquera', 'ARQUERA']]) {
  try {
    const D = await import(`../../tools/convert-v2/out/${id}/skills-${id}.draft.js`);
    if (D[`${K}_SKILLS`]) DRAFT[id] = { skills: D[`${K}_SKILLS`], forge: D[`${K}_SKILL_FORGE`], bar: D[`${K}_SPEC_BAR`], reco: D[`${K}_FORGE_RECO`], fallback: D[`${K}_FALLBACK_BAR`] };
  } catch (e) { console.warn(`[arnés] sin borrador 2g de ${id}: catálogo del juego`, e.message); }
}
const norm = s => normalizeSkillDef(s.talent && !s.kind ? { ...s, kind: 'talent' } : s);

// un héroe de la clase al nivel lv (con su especialización desde el 10) y el juego falso que usa el libro
function hero({ cls = 'maga', lv = 60, spec = null, draft = true, combat = false, forge = 'spec', talents = null, nospec = false } = {}) {
  const T = talentTreesFor(cls);
  spec = lv >= 10 && !nospec ? (spec || T.specs[0].id) : null;
  const h = makeHarness({ classId: cls, level: lv, spec, build: spec ? true : null });
  const p = h.p;
  draft = draft && !!DRAFT[cls];
  if (draft) {
    const D = DRAFT[cls];
    p.cls = { ...CLASSES[cls], skills: D.skills.map(norm), forge: D.forge, forgeReco: D.reco, catalogV: 2 };
    p.hotbar = { ...D.fallback };
    if (spec) Object.assign(p.hotbar, D.bar[spec]?.bar || {});
    p.skillForge = spec && forge === 'spec' ? { ...(D.bar[spec]?.forge || {}) } : {};
    // activas de talento compradas (etiqueta TALENTO/PARAGON en el kit base): por defecto una desde
    // el nivel 21; &talents=6, todas (las de clase primero)
    const n = talents ?? (lv >= 21 ? 1 : 0);
    const tal = p.cls.skills.filter(s => s.kind === 'talent').sort((a, b) => !!a.hero - !!b.hero).slice(0, n);
    for (const s of tal) p.talentExtra.grants.add(s.id);
  }
  // la barra solo lleva habilidades que conoces (como el juego)
  p.recompute();
  for (const [slot, id] of Object.entries(p.hotbar)) { const sk = p.cls.skills.find(s => s.id === id); if (!sk || !isKnown(p, sk)) p.hotbar[slot] = null; }
  p.knownSupports = SUPPORTS.slice(0, 9).map(s => s.id);
  p.supports = {};
  if (p.hotbar.rmb && lv >= 20) p.supports[p.hotbar.rmb] = [p.knownSupports[0]];
  p.recompute();
  p.resolved = {};
  h.g.combatFree = !combat;
  h.g.save = () => {};
  h.g.ui = { message: t => console.info('[ui]', t), refreshHotbar() {} };
  return { h, spec };
}

let cur = null;
function mount(o) {
  cur?.book?.close();
  cur?.book?.el?.remove();
  const { h, spec } = hero(o);
  const book = createSkillBook(document.body, {
    game: h.g, tipDelay: 0,
    onClose: () => console.info('[libro] cerrado'),
    onOpenTalents: () => console.info('[libro] abrir Talentos'),
  });
  cur = { h, book, spec, o };
  window.__book = cur;
  return cur;
}
function center(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
function fire(el, type, x, y, extra = {}) {
  const Ev = type.startsWith('pointer') ? PointerEvent : MouseEvent;
  el.dispatchEvent(new Ev(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, button: 0, pointerId: 1, ...extra }));
}
function cursorAt(x, y) {
  let c = document.querySelector('.fake-cursor');
  if (!c) {
    c = document.createElement('div');
    c.className = 'fake-cursor';
    c.innerHTML = '<svg viewBox="0 0 18 26"><path d="M1 1 L1 21 L6 16 L10 25 L13 23.5 L9 15 L16 15 Z" fill="#f4ecd8" stroke="#1a120a" stroke-width="1.5" stroke-linejoin="round"/></svg>';
    document.body.appendChild(c);
  }
  c.style.transform = `translate(${x - 1}px, ${y - 1}px)`;
}

// escenas con nombre para las capturas
const SHOTS = {
  'maga60': { cls: 'maga', lv: 60, spec: 'piromante', sel: 'bola_fuego' },
  'maga60-var': { cls: 'maga', lv: 60, spec: 'piromante', sel: 'bola_fuego', hover: '.sb-var[data-var="i"]' },
  'maga60-alt': { cls: 'maga', lv: 60, spec: 'piromante', sel: 'bola_fuego', hover: '.sb-tile[data-skill="m_dardo"]', alt: true },
  'maga60-pop': { cls: 'maga', lv: 60, spec: 'piromante', sel: 'bola_fuego', pop: 1 },
  'maga60-3t': { cls: 'maga', lv: 60, spec: 'piromante', sel: 'bola_fuego', talents: 3 },
  'maga100-6t': { cls: 'maga', lv: 100, spec: 'crionte', sel: 'm_t_contrahechizo', talents: 6 },
  'guerrero100-6t': { cls: 'guerrero', lv: 100, spec: 'cruzado', talents: 6 },
  'arquera100-6t': { cls: 'arquera', lv: 100, spec: 'montaraz', talents: 6 },
  'guerrero11-ber': { cls: 'guerrero', lv: 11, spec: 'berserker', forge: 'none' },
  'arquera12-sinspec': { cls: 'arquera', lv: 12, nospec: true },
  'guerrero40-v1': { cls: 'guerrero', lv: 40, spec: 'guardian', draft: false },
  'guerrero18': { cls: 'guerrero', lv: 18, spec: 'berserker', sel: 'g_hendidura', forge: 'none' },
  'guerrero18-mech': { cls: 'guerrero', lv: 18, spec: 'berserker', sel: 'g_hendidura', forge: 'none', hover: '.sb-gchip[data-g="mech"]' },
  'guerrero40-drag': { cls: 'guerrero', lv: 40, spec: 'guardian', drag: 'g_lanza:k2' },
  'arquera5': { cls: 'arquera', lv: 5, sel: 'a_disparo' },
  'arquera5-spec': { cls: 'arquera', lv: 5, hover: '.sb-srow[data-spec="montaraz"] [data-tipspec]' },
  'arquera30-combat': { cls: 'arquera', lv: 30, spec: 'francotiradora', combat: true, hover: '.sb-var[data-var="ii"]' },
  'maga30-v1': { cls: 'maga', lv: 30, spec: 'crionte', draft: false },
  'swap': { cls: 'maga', lv: 40, spec: 'piromante', swap: 'crionte' },
};

async function scene(o) {
  const c = mount(o);
  if (o.swap) {
    // la tira «qué cambia» sale con el libro cerrado: foto, cambio de especialización, resumen
    const p = c.h.p;
    const before = specSnapshot(p);
    p.talents = { ...p.talents, spec: o.swap };
    const D = DRAFT[o.cls];
    if (o.draft !== false && D?.bar?.[o.swap]) { Object.assign(p.hotbar, D.bar[o.swap].bar); p.skillForge = { ...D.bar[o.swap].forge }; }
    p.recompute();
    c.book.showSpecSwap(specSwapSummary(before, p), { ms: 60000 });
    window.__ready = true;
    return c;
  }
  c.book.open();
  if (o.sel) c.book.select(o.sel);
  await frame();
  if (o.alt) document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Alt', code: 'AltLeft', bubbles: true }));
  if (o.hover) {
    const el = document.querySelector(o.hover);
    if (el) { const { x, y } = center(el); fire(el, 'mouseover', x, y); fire(el, 'mousemove', x, y); cursorAt(x, y); await sleep(30); }
    else console.error('[arnés] sin', o.hover);
  }
  if (o.pop != null) {
    const s = document.querySelector(`.sb-sock[data-sock="${o.pop}"]`) || document.querySelector('.sb-sock');
    if (s) { const { x, y } = center(s); fire(s, 'pointerdown', x, y); fire(s, 'click', x, y); const g = document.querySelector('.sb-pop .gm.ok'); if (g) { const q = center(g); fire(g, 'mouseover', q.x, q.y); cursorAt(q.x, q.y); await sleep(30); } }
  }
  if (o.drag) {
    const [id, slot] = o.drag.split(':');
    const t = document.querySelector(`.sb-tile[data-skill="${id}"]`);
    const s = document.querySelector(`.sb-slot[data-slot="${slot}"]`);
    if (t && s) {
      const a = center(t), b = center(s);
      fire(t, 'pointerdown', a.x, a.y);
      for (let k = 1; k <= 6; k++) { const x = a.x + (b.x - a.x) * k / 6, y = a.y + (b.y - a.y) * k / 6; window.dispatchEvent(new PointerEvent('pointermove', { clientX: x, clientY: y, bubbles: true })); }
      cursorAt(b.x, b.y);
    }
  }
  await document.fonts?.ready;
  await frame();
  c.book.check();
  window.__ready = true;
  return c;
}

// ?measure=1: A5/A4 de cada combinación y de la forja de cada habilidad del libro
async function measure() {
  await document.fonts?.ready;
  const out = { runs: 0, forges: 0, overlaps: [], offscreen: [], errors: [], ms: [] };
  const combos = [];
  for (const cls of ['maga', 'guerrero', 'arquera']) {
    const specs = talentTreesFor(cls).specs.map(s => s.id);
    combos.push({ cls, lv: 1 }, { cls, lv: 5 });
    for (const spec of specs) combos.push({ cls, lv: 18, spec, forge: 'none' }, { cls, lv: 60, spec }, { cls, lv: 100, spec, talents: 6 });
    combos.push({ cls, lv: 12, nospec: true }, { cls, lv: 30, spec: specs[0], combat: true }, { cls, lv: 60, spec: specs[2], talents: 3 });
    for (const spec of specs) combos.push({ cls, lv: 40, spec, draft: false });
  }
  for (const o of combos) {
    try {
      const c = mount(o);
      const t0 = performance.now();
      c.book.open();
      out.ms.push(performance.now() - t0);
      await frame();
      out.runs++;
      const tag = `${o.cls}${o.lv}${o.spec ? '/' + o.spec : o.nospec ? '/sin especialización' : ''}${o.talents ? `/${o.talents} activas` : ''}${o.draft === false ? '/v1' : ''}`;
      const take = r => { for (const x of r.overlaps) out.overlaps.push(`${tag}: ${x}`); for (const x of r.offscreen) out.offscreen.push(`${tag}: ${x}`); };
      take(c.book.check());
      // la forja de cada habilidad del libro
      for (const el of [...document.querySelectorAll('.sb-tile')]) {
        c.book.select(el.dataset.skill);
        out.forges++;
        const r = c.book.check();
        take({ overlaps: r.overlaps.filter(x => !x.startsWith('.sb-tile') && !x.startsWith('.sb-sec')), offscreen: r.offscreen.filter(x => !/sb-tile|bajo el pliegue/.test(x)) });
      }
      c.book.close();
    } catch (e) { out.errors.push(`${o.cls}${o.lv}: ${e.message}`); console.error(e); }
  }
  const avg = out.ms.reduce((a, b) => a + b, 0) / Math.max(1, out.ms.length);
  const res = { vw: innerWidth, vh: innerHeight, runs: out.runs, forges: out.forges, openMs: Math.round(avg * 10) / 10,
    overlaps: [...new Set(out.overlaps)], offscreen: [...new Set(out.offscreen)], errors: out.errors };
  window.__measure = res;
  document.getElementById('measure').textContent = JSON.stringify(res, null, 1);
}

// ?selftest=1: las interacciones del libro con el ratón y el teclado sobre el héroe real
async function selftest() {
  await document.fonts?.ready;
  const res = [];
  const ok = (cond, what) => res.push(`${cond ? 'OK ' : 'MAL'} ${what}`);
  const key = (code, k = code, extra = {}) => document.dispatchEvent(new KeyboardEvent('keydown', { code, key: k, bubbles: true, cancelable: true, ...extra }));
  const tile = id => document.querySelector(`.sb-tile[data-skill="${id}"]`);
  let closed = 0, talents = 0;
  const c = mount({ cls: 'maga', lv: 60, spec: 'piromante', forge: 'none' });
  c.book.close(); c.book.el.remove();
  const book = createSkillBook(document.body, { game: c.h.g, tipDelay: 0, onClose: () => closed++, onOpenTalents: () => talents++ });
  const p = c.h.p;
  ok(!book.el.hasAttribute('data-open') && !document.querySelector('#skills-book[data-open]'), 'cerrado: sin data-open (el humo lo lee por presencia)');
  book.open(); await frame();
  ok(book.el.hasAttribute('data-open') && book.el.matches('#skills-book[data-open]'), 'abre (#skills-book[data-open], por presencia)');
  const order = [...document.querySelectorAll('.sb-tile')].map(t => t.dataset.skill);
  book.select(order[0]);
  key('ArrowRight');
  ok(document.querySelector('.sb-tile.sel')?.dataset.skill === order[1], '→ pasa a la siguiente');
  key('ArrowLeft'); key('ArrowLeft');
  ok(document.querySelector('.sb-tile.sel')?.dataset.skill === order.at(-1), '← desde la primera va a la última');
  // 1–4 sobre la casilla bajo el ratón
  const nova = tile('nova_hielo'), q = center(nova);
  fire(nova, 'mouseover', q.x, q.y);
  key('Digit2', '2');
  ok(p.hotbar.k2 === 'nova_hielo', '2 con el ratón encima asigna la ranura 2');
  key('Digit1', '1');
  ok(p.hotbar.k1 !== 'nova_hielo', 'una principal no entra en la ranura 1 (aviso)');
  // fuera de una casilla ya no hay «bajo el ratón»: 2 no asigna la última casilla que se pisó
  const k2was = p.hotbar.k2 = null;
  const slotEl = document.querySelector('.sb-slot[data-slot="k4"]'), sq4 = center(slotEl);
  fire(nova, 'mouseover', q.x, q.y); fire(slotEl, 'mouseover', sq4.x, sq4.y);
  key('Digit2', '2');
  ok(p.hotbar.k2 !== 'nova_hielo' && k2was === null, 'tras salir de la casilla, 2 no asigna la casilla anterior');
  // clic derecho: a su ranura natural
  const bar = tile('m_barrera'), b = center(bar);
  fire(bar, 'contextmenu', b.x, b.y);
  ok(p.hotbar.k2 === 'm_barrera', 'clic derecho: a su ranura natural (2)');
  // arrastre completo a la ranura DER
  book.select('bola_fuego'); await frame();
  const t = tile('meteoro'), a = center(t), s = center(document.querySelector('.sb-slot[data-slot="rmb"]'));
  fire(t, 'pointerdown', a.x, a.y);
  window.dispatchEvent(new PointerEvent('pointermove', { clientX: a.x + 30, clientY: a.y + 30 }));
  window.dispatchEvent(new PointerEvent('pointermove', { clientX: s.x, clientY: s.y }));
  window.dispatchEvent(new PointerEvent('pointerup', { clientX: s.x, clientY: s.y }));
  ok(p.hotbar.rmb === 'meteoro', 'arrastre a DER');
  // forja: clic en la variante, otra vez la quita; Intro sobre la enfocada
  book.select('bola_fuego'); await frame();
  let v = document.querySelector('.sb-var[data-var="i"]'), vq = center(v);
  fire(v, 'click', vq.x, vq.y);
  ok(p.skillForge.bola_fuego === 'i' && document.querySelector('.sb-var[data-var="i"]').dataset.state === 'elegida', 'clic elige la I (data-state="elegida")');
  v = document.querySelector('.sb-var[data-var="i"]'); fire(v, 'click', vq.x, vq.y);
  ok(p.skillForge.bola_fuego === null, 'otro clic la quita');
  v = document.querySelector('.sb-var[data-var="ii"]'); v.focus(); key('Enter');
  ok(p.skillForge.bola_fuego === 'ii', 'Intro sobre la II enfocada');
  // «Recomendado»
  document.querySelector('[data-act="reco"]').click();
  ok(HMrecoPlan(p).length === 0, '«Recomendado» aplica las variantes recomendadas');
  // Alt amplía el tooltip
  const dq = center(tile('m_dardo'));
  fire(tile('m_dardo'), 'mouseover', dq.x, dq.y); await sleep(20);
  const before = document.querySelector('.sb-tip').innerHTML.includes('Detalle (Alt)');
  key('AltLeft', 'Alt'); await sleep(5);
  const after = document.querySelector('.sb-tip').innerHTML.includes('Detalle (Alt)');
  document.dispatchEvent(new KeyboardEvent('keyup', { code: 'AltLeft', key: 'Alt', bubbles: true }));
  ok(!before && after, 'Alt añade el detalle al tooltip');
  ok(document.querySelector('.sb-tip').innerHTML.includes('Talentos que la tocan'), 'tooltip con «Talentos que la tocan»');
  // engarces: abrir, elegir, quitar
  const sock = document.querySelector('.sb-sock[data-sock="1"]');
  if (sock) {
    book.select('bola_fuego'); await frame();
    const sk = document.querySelector('.sb-sock[data-sock="1"]'), sq = center(sk);
    fire(sk, 'pointerdown', sq.x, sq.y); fire(sk, 'click', sq.x, sq.y);
    const gm = document.querySelector('.sb-pop .gm.ok');
    const id = gm?.dataset.sup;
    if (gm) { const gq = center(gm); fire(gm, 'click', gq.x, gq.y); }
    ok(!!id && p.supports.bola_fuego?.includes(id), 'engarce elegido en la cuadrícula');
    // cada estado que no es «ok» lleva su marca de forma (no solo atenuado): candado, aspa o el otro engarce
    const s0 = document.querySelector('.sb-sock[data-sock="0"]'), s0q = center(s0);
    fire(s0, 'pointerdown', s0q.x, s0q.y); fire(s0, 'click', s0q.x, s0q.y);
    const marks = [...document.querySelectorAll('.sb-pop .gm')].filter(g => !g.classList.contains('none') && !g.classList.contains('cur'));
    const want = { unknown: '.mk.lk svg', incompatible: '.mk.no', used: '.mk.us' };
    const badMk = marks.filter(g => { const st = Object.keys(want).find(k => g.classList.contains(k)); return st ? !g.querySelector(want[st]) : !!g.querySelector('.mk'); });
    const usedMk = document.querySelector(`.sb-pop .gm.used[data-sup="${id}"] .mk.us`)?.textContent;
    ok(!badMk.length && marks.some(g => g.classList.contains('unknown')) && usedMk === '2', `engarces: candado / aspa / «2» del otro engarce (${badMk.length} sin marca)`);
    document.querySelector('.sb-x').dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
  }
  // N abre Talentos; combate bloquea la forja; T y Esc cierran
  key('KeyN', 'n');
  ok(talents === 1, 'N abre Talentos');
  c.h.g.combatFree = false; book.refresh(); await frame();
  v = document.querySelector('.sb-var[data-var="i"]'); vq = center(v);
  fire(v, 'click', vq.x, vq.y);
  ok(p.skillForge.bola_fuego === 'ii' && document.querySelector('.sb-note.lock'), 'en combate no cambia (aviso en el pie)');
  c.h.g.combatFree = true;
  key('KeyT', 't');
  ok(!book.el.hasAttribute('data-open') && !document.querySelector('#skills-book[data-open]') && closed === 1, 'T cierra (sin data-open)');
  book.open(); key('Escape');
  ok(!book.el.hasAttribute('data-open') && closed === 2, 'Esc cierra');
  // ?skillscheck=1 deja window.__uicheck
  book.open(); await frame();
  const chk = book.check();
  ok(window.__uicheck === chk && chk.panel === 'skills' && !chk.overlaps.length && !chk.offscreen.length, 'check() → window.__uicheck sin solapes ni fuera de pantalla');
  book.close();
  // kit de TU especialización aún sin aprender: candado con su nivel (nunca «Nv» a secas)
  {
    const g = mount({ cls: 'guerrero', lv: 11, spec: 'berserker', forge: 'none' });
    g.book.open(); await frame();
    const locks = [...document.querySelectorAll('.sb-spec .sb-tile.locked .sb-lock')].map(l => l.textContent.trim());
    ok(locks.length > 0 && locks.every(t => /^Nv \d+$/.test(t) && +t.slice(3) > 11), `kit propio sin aprender: candado con nivel (${locks.join(', ')})`);
    g.book.close();
  }
  // nivel ≥ 10 sin especialización: «Elegir» en cada fila (abre Talentos), sin candado de nivel
  {
    let opened = 0;
    const g = mount({ cls: 'arquera', lv: 12, nospec: true });
    g.book.close(); g.book.el.remove();
    const b2 = createSkillBook(document.body, { game: g.h.g, tipDelay: 0, onOpenTalents: () => opened++ });
    b2.open(); await frame();
    const rowsN = document.querySelectorAll('.sb-others.pre .sb-srow').length;
    const choose = [...document.querySelectorAll('.sb-others.pre .sb-choose[data-act="talents"]')];
    const head = document.querySelector('.sb-others.pre .sb-sec-h .n')?.textContent || '';
    choose[0]?.click();
    ok(rowsN === 3 && choose.length === 3 && !document.querySelector('.sb-others.pre .lv svg') && /Talentos/.test(head) && opened === 1, `sin especialización a Nv 12: «Elegir» en las 3 filas y abre Talentos («${head}»)`);
    b2.close(); b2.el.remove();
  }
  // nombres largos: «Contrahechizo» se parte con guion y cabe (check() mira .sb-nm)
  {
    const g = mount({ cls: 'maga', lv: 100, spec: 'crionte', talents: 6 });
    g.book.open(); await frame();
    const nm = document.querySelector('.sb-tile[data-skill="m_t_contrahechizo"] .sb-nm');
    const r = g.book.check();
    ok(nm && nm.textContent.includes('\u00ad') && nm.scrollWidth <= nm.clientWidth + 1 && document.querySelector('.sb-book.dense') && !r.overlaps.length && !r.offscreen.length,
      `6 activas de talento: libro compacto sin nada fuera y «Contrahechizo» entero (${r.offscreen.join(' · ')})`);
    g.book.close();
  }
  const bad = res.filter(r => r.startsWith('MAL'));
  window.__selftest = { ok: !bad.length, res };
  document.getElementById('measure').textContent = JSON.stringify(window.__selftest, null, 1);
}

// controles
const $ = id => document.getElementById(id);
for (const lv of [1, 5, 10, 18, 30, 60, 100]) $('c-lv').insertAdjacentHTML('beforeend', `<option value="${lv}">Nv ${lv}</option>`);
function fillSpecs() {
  $('c-spec').innerHTML = talentTreesFor($('c-cls').value).specs.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
}
function fromCtl() { return { cls: $('c-cls').value, lv: +$('c-lv').value, spec: $('c-spec').value, combat: $('c-combat').checked, draft: $('c-draft').checked }; }
$('c-cls').addEventListener('change', () => { fillSpecs(); scene(fromCtl()); });
for (const id of ['c-lv', 'c-spec', 'c-combat', 'c-draft']) $(id).addEventListener('change', () => scene(fromCtl()));
$('c-open').addEventListener('click', () => (cur?.book?.isOpen() ? cur.book.close() : cur?.book?.open()));
document.addEventListener('keydown', e => { if (e.code === 'KeyT' && cur && !cur.book.isOpen()) cur.book.open(); });

const named = SHOTS[Q.get('shot')];
const o = named ? { ...named } : {
  cls: Q.get('cls') || 'maga', lv: +(Q.get('lv') || 60), spec: Q.get('spec') || null, sel: Q.get('sel') || null,
  combat: Q.get('combat') === '1', draft: Q.get('draft') !== '0', forge: Q.get('forge') || 'spec',
  hover: Q.get('hover') || null, alt: Q.get('alt') === '1', pop: Q.get('pop'), drag: Q.get('drag'), swap: Q.get('swap'),
  talents: Q.get('talents') != null ? +Q.get('talents') : null, nospec: Q.get('nospec') === '1',
};
$('c-cls').value = o.cls; fillSpecs(); $('c-lv').value = String(o.lv);
if (o.spec) $('c-spec').value = o.spec;
$('c-combat').checked = !!o.combat; $('c-draft').checked = o.draft !== false;
if (Q.get('measure') === '1') { document.body.classList.add('bare'); measure(); }
else if (Q.get('selftest') === '1') { document.body.classList.add('bare'); selftest(); }
else scene(o);
</script>
</body>
</html>
